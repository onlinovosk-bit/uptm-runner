name: Pytest

on:
  pull_request:
  push:
    branches:
      - main
      - "cursor/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest

      # A green suite proves the guards pass. It cannot prove they would fail:
      # a deleted, renamed or weakened proof reads exactly like a passing one.
      # This step breaks each named mechanism on purpose and requires the proofs
      # that exist for it to go red. It restores the source after every case.
      - name: Mutation gate (guards are load-bearing)
        run: python -m runner.cli mutation-gate

      - name: Enforcement evidence (UPTM-006)
        run: python -m runner.cli enforcement-evidence --commit "${{ github.sha }}"
