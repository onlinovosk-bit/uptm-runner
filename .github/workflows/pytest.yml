name: Pytest

on:
  pull_request:
  push:
    branches:
      - main
      - "cursor/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest

      - name: Enforcement evidence (UPTM-006, Evidence Rule A)
        # No commit is passed in. The runner reads the evaluated head from the
        # checkout itself, so CI cannot tell the artifact which commit it
        # evidences - it can only be the commit that is actually checked out.
        run: python -m runner.cli enforcement-evidence
